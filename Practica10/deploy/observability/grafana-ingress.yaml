apiVersion: cert-manager.io/v1
kind: Certificate
metadata:
  name: academix-grafana-tls
spec:
  secretName: academix-grafana-tls
  issuerRef:
    name: letsencrypt-prod
    kind: ClusterIssuer
  dnsNames:
    - grafana.academix.34.123.206.113.sslip.io
---
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: grafana
  annotations:
    traefik.ingress.kubernetes.io/router.middlewares: monitoring-redirect-https@kubernetescrd
spec:
  ingressClassName: traefik
  tls:
    - hosts:
        - grafana.academix.34.123.206.113.sslip.io
      secretName: academix-grafana-tls
  rules:
    - host: grafana.academix.34.123.206.113.sslip.io
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: kube-prometheus-stack-grafana
                port:
                  number: 80