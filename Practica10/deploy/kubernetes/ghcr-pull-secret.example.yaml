# Plantilla del imagePullSecret para descargar imágenes privadas desde GHCR.
# NO contiene credenciales reales y NO debe llenarse y subirse al repositorio.
#
# Forma recomendada de crearlo (el PAT necesita el permiso read:packages):
#
#   kubectl create secret docker-registry ghcr-pull-secret \
#     --namespace academix-prod \
#     --docker-server=ghcr.io \
#     --docker-username=<usuario-github> \
#     --docker-password=<PAT-con-read:packages> \
#     --docker-email=<correo>
#
# Los cuatro Deployments de la aplicación ya referencian este secret en
# `spec.template.spec.imagePullSecrets`, así que una vez creado el namespace
# queda autorizado para descargar de GHCR.
apiVersion: v1
kind: Secret
metadata:
  name: ghcr-pull-secret
  namespace: academix-prod
type: kubernetes.io/dockerconfigjson
stringData:
  .dockerconfigjson: |
    {"auths":{"ghcr.io":{"username":"REEMPLAZAR_USUARIO","password":"REEMPLAZAR_PAT","auth":"REEMPLAZAR_BASE64_USUARIO_PAT"}}}
