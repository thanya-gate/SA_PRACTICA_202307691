apiVersion: v1
kind: Service
metadata:
  name: catalogo-service
  labels:
    app.kubernetes.io/name: catalogo-service
    app.kubernetes.io/part-of: academix
spec:
  type: ClusterIP
  selector:
    app.kubernetes.io/name: catalogo-service
  ports:
    - name: http
      port: 8080
      targetPort: http
    - name: grpc
      port: 50061
      targetPort: grpc
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: catalogo-service
  labels:
    app.kubernetes.io/name: catalogo-service
    app.kubernetes.io/part-of: academix
spec:
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: catalogo-service
  template:
    metadata:
      labels:
        app.kubernetes.io/name: catalogo-service
        app.kubernetes.io/part-of: academix
    spec:
      containers:
        - name: catalogo-service
          image: ghcr.io/thanya-gate/academix/catalogo-service
          imagePullPolicy: Always
          ports:
            - name: http
              containerPort: 8080
            - name: grpc
              containerPort: 50061
          envFrom:
            - configMapRef:
                name: academix-config-comun
          env:
            - name: CATALOGO_VERSION
              value: "4.0.0"
            - name: CATALOGO_HTTP_PUERTO
              value: "8080"
            - name: CATALOGO_GRPC_PUERTO
              value: "50061"
            - name: DB_USER
              valueFrom:
                secretKeyRef:
                  name: academix-secrets
                  key: db-username
            - name: DB_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: academix-secrets
                  key: db-password
            - name: CATALOGO_PG_DSN
              value: postgresql://$(DB_USER):$(DB_PASSWORD)@postgres-catalogo:5432/academix_catalogo
            - name: CATALOGO_PG_MAX_CONEXIONES
              value: "10"
            - name: CATALOGO_REDIS_URL
              value: redis://redis:6379/1
            - name: CATALOGO_TTL_LISTADO_SEG
              value: "15"
            - name: CATALOGO_TTL_DETALLE_SEG
              value: "30"
            - name: CATALOGO_PROTO_DIR
              value: /app/proto
          readinessProbe:
            httpGet:
              path: /api/talleres/salud
              port: http
            initialDelaySeconds: 15
            periodSeconds: 10
            timeoutSeconds: 4
            failureThreshold: 6
          livenessProbe:
            tcpSocket:
              port: http
            initialDelaySeconds: 35
            periodSeconds: 20
            timeoutSeconds: 4
          resources:
            requests:
              cpu: 100m
              memory: 128Mi
            limits:
              cpu: 500m
              memory: 384Mi
---
