<text x="1100.0" y="615.44" text-anchor="middle" dominant-baseline="middle" font-family="Arial, Helvetica, sans-serif" font-size="18px" font-weight="700" fill="#ffffff"><tspan x="1100.0" dy="0">4 · ANSIBLE · site.yml</tspan><tspan x="1100.0" dy="23.04">espera SSH y cloud-init</tspan><tspan x="1100.0" dy="23.04">rol base: utilitarios y SSH seguro</tspan><tspan x="1100.0" dy="23.04">configuración idempotente</tspan></text>
