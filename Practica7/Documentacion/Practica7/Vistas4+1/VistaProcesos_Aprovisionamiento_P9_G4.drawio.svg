<text x="990.0" y="69.0" text-anchor="middle" dominant-baseline="middle" font-family="Arial, Helvetica, sans-serif" font-size="32px" font-weight="700" fill="#ffffff"><tspan x="990.0" dy="0">VISTA DE PROCESOS · PRÁCTICA 9</tspan></text>
<text x="990.0" y="115.0" text-anchor="middle" dominant-baseline="middle" font-family="Arial, Helvetica, sans-serif" font-size="17px" font-weight="700" fill="#ffffff"><tspan x="990.0" dy="0">Flujo automatizado de aprovisionamiento · Terraform → Ansible → Estado listo</tspan></text>
<text x="990.0" y="1268.0" text-anchor="middle" dominant-baseline="middle" font-family="Arial, Helvetica, sans-serif" font-size="16px" font-weight="700" fill="#ffffff"><tspan x="990.0" dy="0">Reconstrucción en vivo: terraform destroy → terraform apply → ansible-playbook -i inventory.ini site.yml</tspan></text>
