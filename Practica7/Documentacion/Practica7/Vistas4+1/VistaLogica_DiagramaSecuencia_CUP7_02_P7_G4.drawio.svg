  <text class="actorLabel" x="140" y="240" text-anchor="middle">Estudiante</text>
  <line class="message" x1="140" y1="210" x2="470" y2="210"/>
  <text class="labelText" x="305" y="203">1. Selecciona un evento</text>
  <line class="message" x1="470" y1="258" x2="800" y2="258"/>
  <text class="labelText" x="635" y="251">2. GET /mock/events/{eventId}</text>
  <line class="message" x1="800" y1="306" x2="1130" y2="306"/>
  <text class="labelText" x="965" y="299">3. Solicita detalle y disponibilidad</text>
  <line class="message" x1="1130" y1="354" x2="1460" y2="354"/>
  <text class="labelText" x="1295" y="347">4. Lee metadata y cupos</text>
  <line class="return" x1="1460" y1="402" x2="1130" y2="402"/>
  <text class="labelText" x="1295" y="395">5. Retorna detalle del evento</text>
  <line class="return" x1="1130" y1="450" x2="800" y2="450"/>
  <text class="labelText" x="965" y="443">6. Responde cupo y prerrequisitos</text>
  <line class="return" x1="800" y1="498" x2="470" y2="498"/>
  <text class="labelText" x="635" y="491">7. Entrega información completa</text>
  <path class="message" d="M477 546 H542 Q562 546 562 564 Q562 582 542 582 H477"/>
  <text class="labelText" x="518" y="540">8. Verifica disponibilidad</text>
  <line class="return" x1="470" y1="594" x2="140" y2="594"/>
  <text class="labelText" x="305" y="587">9. Habilita reserva o muestra SIN_CUPO</text>
  <line class="separator" x1="55" y1="616" x2="1545" y2="616"/>
  <text class="foot" x="800" y="1000" text-anchor="middle">El frontend habilita reservar solo cuando la disponibilidad es mayor que cero.</text>
