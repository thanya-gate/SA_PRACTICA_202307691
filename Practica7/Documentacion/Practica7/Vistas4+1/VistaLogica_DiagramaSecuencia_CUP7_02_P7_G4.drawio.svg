  <rect class="box" x="690" y="112" width="220" height="48"/>
  <text class="text" x="800" y="137" text-anchor="middle">API Gateway</text>
  <line class="line" x1="800" y1="160" x2="800" y2="990"/>
  <rect class="box" x="1020" y="112" width="220" height="48"/>
  <text class="text" x="1130" y="137" text-anchor="middle">Servicio de Talleres</text>
  <line class="line" x1="1130" y1="160" x2="1130" y2="990"/>
  <rect class="box" x="1350" y="112" width="220" height="48"/>
  <text class="text" x="1460" y="137" text-anchor="middle">BD / Mock catálogo</text>
  <line class="line" x1="1460" y1="160" x2="1460" y2="990"/>
  <rect class="activation" x="464" y="210.0" width="12" height="400.8"/>
