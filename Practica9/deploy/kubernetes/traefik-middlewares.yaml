apiVersion: traefik.io/v1alpha1
kind: Middleware
metadata:
  name: redirect-https
spec:
  redirectScheme:
    scheme: https
    permanent: true
---
apiVersion: traefik.io/v1alpha1
kind: Middleware
metadata:
  name: strip-catalogo
spec:
  stripPrefix:
    prefixes:
      - /catalogo
---
apiVersion: traefik.io/v1alpha1
kind: Middleware
metadata:
  name: strip-reservas
spec:
  stripPrefix:
    prefixes:
      - /reservas
---
apiVersion: traefik.io/v1alpha1
kind: Middleware
metadata:
  name: strip-certificados
spec:
  stripPrefix:
    prefixes:
      - /certificados
