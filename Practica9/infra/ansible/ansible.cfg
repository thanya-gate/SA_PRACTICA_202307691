# ansible.cfg - Se lee automaticamente al ejecutar ansible-playbook desde esta carpeta.
[defaults]
inventory         = inventory.ini
roles_path        = roles
host_key_checking = False
retry_files_enabled = False
interpreter_python = /usr/bin/python3
stdout_callback   = default
callback_result_format = yaml
forks             = 5
timeout           = 30

[ssh_connection]
# Tras un destroy/apply, GCP puede reutilizar la misma IP con otra host key:
# no se guarda known_hosts para que la reconstruccion no se bloquee.
# IdentitiesOnly evita que el agente ofrezca otras claves y choque con MaxAuthTries.
ssh_args   = -o ControlMaster=auto -o ControlPersist=60s -o StrictHostKeyChecking=no -o UserKnownHostsFile=/dev/null -o IdentitiesOnly=yes
pipelining = True
