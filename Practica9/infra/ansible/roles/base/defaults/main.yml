---
# apt upgrade completo. La practica pide actualizar repositorios (apt update);
# el upgrade de todo el sistema es opcional por el tiempo que toma.
base_apt_upgrade: false

base_packages:
  - git
  - curl
  - htop
  - net-tools
  - ca-certificates
  - gnupg
  - fail2ban

# Valores del drop-in de sshd (templates/00-hardening.conf.j2).
ssh_permit_root_login: "no"
ssh_password_authentication: "no"
ssh_max_auth_tries: 3
ssh_client_alive_interval: 300
ssh_client_alive_count_max: 2
